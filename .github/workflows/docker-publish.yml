name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monica
          POSTGRES_PASSWORD: monica
          POSTGRES_DB: monica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monica -d monica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://monica:monica@localhost:5432/monica_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://monica:monica@localhost:5432/monica
        run: python -m pytest -v

  backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            edreimp/movfit-ia-backend:latest
            edreimp/movfit-ia-backend:${{ github.sha }}

  frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            edreimp/movfit-ia-frontend:latest
            edreimp/movfit-ia-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://200.6.142.5:8001
