services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monica
      POSTGRES_PASSWORD: 1863d5c33e605af8ea3795e69f608a1b9961790d
      POSTGRES_DB: monica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monica -d monica"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: edreimp/movfit-ia-backend:latest
    restart: unless-stopped
    ports:
      # host:container — 8001 no host pra não colidir com a porta 8000 que o
      # próprio Portainer usa (Edge Agent). Dentro do container continua 8000.
      - "8001:8000"
    environment:
      APP_NAME: Monica AI
      APP_ENV: production
      SECRET_KEY: 159c44189132cd6b65fd2b8004a18903baaf801d0938808d60e93a012c73fc45
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: postgresql+asyncpg://monica:1863d5c33e605af8ea3795e69f608a1b9961790d@db:5432/monica
      ENCRYPTION_KEY: 876d4a77ecb49c89652733eaf0ebe45a3f6890b55134c7bec4105990649796bb
      # Origem(ns) do frontend em produção, separadas por vírgula (sem barra no final).
      CORS_ORIGINS: http://200.6.142.5:5174
      OPENAI_DEFAULT_MODEL: gpt-4o-mini
      AI_REPLY_DEBOUNCE_SECONDS: 8
      AI_BUBBLE_MAX_CHARS: 320
      AI_BUBBLE_DELAY_SECONDS: 1.2
      PUBLIC_BASE_URL: http://200.6.142.5:8001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    image: edreimp/movfit-ia-frontend:latest
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
